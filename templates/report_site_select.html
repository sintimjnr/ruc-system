{% extends "base.html" %}
{% block active_module %}reports{% endblock %}
{% block page_title %}Site Report{% endblock %}
{% block page_subtitle %}Select a site{% endblock %}

{% block content %}
<div class="container">
<div class="form-box wide">
        <h2>Select Site</h2>
        <form method="GET" class="filter-grid">
          <select name="duid" required>
            <option value="">Select DUID</option>
            {% for duid in duids %}
              <option value="{{ duid }}">{{ duid }}</option>
            {% endfor %}
          </select>
          <button type="submit">Open Site Report</button>
        </form>
      </div>
    </div>
{% endblock %}
