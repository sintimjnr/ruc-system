{% extends "base.html" %}
{% block active_module %}users{% endblock %}
{% block page_title %}User Password{% endblock %}
{% block page_subtitle %}Account password reset{% endblock %}

{% block content %}
<div class="container">
<div class="form-box">
        <h2>Reset Password</h2>
        <p>{{ user.username }}</p>
        <form method="POST">
          <label>New Password</label>
          <input name="password" type="password" required />

          <label>Confirm Password</label>
          <input name="confirm_password" type="password" required />

          <button type="submit">Update Password</button>
          <a class="btn" href="{{ url_for('users') }}">Cancel</a>
        </form>
      </div>
    </div>
{% endblock %}
