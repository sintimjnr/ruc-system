<!DOCTYPE html>
<html>

<head>

<link rel="stylesheet"
href="{{ static_asset('css/style.css') }}">

</head>


<body>


<div class="login-box">


<center>

<img
src="{{ url_for('static',
filename='images/ruc_logo.png') }}"
width="150">

<h2>RUC Management System</h2>

</center>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<div class="notice">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}


<form method="POST">
{% include "partials/csrf.html" %}


<input name="username"
placeholder="Username">


<input name="password"
type="password"
placeholder="Password">



<button>

Login

</button>


</form>


</div>


</body>

</html>
